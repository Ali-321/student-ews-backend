name: Django CI/CD Pipeline

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main", "master"]

jobs:
    # ==========================================
    # TAHAP 1: AUTOMATED TESTING
    # ==========================================
    test:
        runs-on: ubuntu-latest

        services:
            mariadb:
                image: mariadb:10.6
                env:
                    MYSQL_ROOT_PASSWORD: admin123
                    MYSQL_DATABASE: student_ews_db
                ports:
                    - 3306:3306
                options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install uv
              uses: astral-sh/setup-uv@v3
              with:
                  enable-cache: true
                  cache-dependency-glob: "requirements/*.txt"

            - name: Install Dependencies with uv
              run: |
                  if [ -f requirements/base.txt ]; then
                    uv pip install --system -r requirements/base.txt
                  fi
                  if [ -f requirements/local.txt ]; then
                    uv pip install --system -r requirements/local.txt
                  fi

            - name: Run Django Tests
              env:
                  DJANGO_SETTINGS_MODULE: config.settings.local
                  DB_ENGINE: django.db.backends.mysql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 3306
                  DB_NAME: student_ews_db
                  DB_USER: root
                  DB_PASSWORD: admin123
              run: |
                  python manage.py test --settings=config.settings.local

    # ==========================================
    # TAHAP 2: DEPLOY TO PRODUCTION (VPS)
    # ==========================================
    deploy:
        name: Deploy to Biznet Gio VPS
        runs-on: ubuntu-latest
        needs: test # WAJIB: Deploy menunggu tahap 'test' sukses
        if: github.event_name == 'push' # WAJIB: Jangan deploy saat Pull Request

        steps:
            - name: Execute Deployment Script via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USERNAME }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      # 1. Pindah ke direktori proyek di server
                      cd /var/www/student_ews

                      # 2. Tarik kode terbaru yang sudah lolos tes
                      git pull origin main

                      # 3. Aktifkan Virtual Environment
                      source .venv/bin/activate

                      # 4. Install dependensi terbaru (Sesuaikan file .txt dengan yang Anda pakai di production)
                      uv pip install -r requirements/base.txt

                      # 5. Jalankan Migrasi Database
                      python manage.py migrate --noinput

                      # 6. Kumpulkan file statis
                      python manage.py collectstatic --noinput

                      # 7. Restart Gunicorn (Background Server) agar kode baru memuat
                      sudo systemctl restart gunicorn
